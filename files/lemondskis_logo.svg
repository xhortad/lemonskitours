  <!-- TEXT SECTION -->
  <!-- LEMONSKI'S -->
  <text x="600" y="980"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="148"
        letter-spacing="4"
        fill="#3C3489">LEMONSKI'S</text>

  <!-- divider line -->
