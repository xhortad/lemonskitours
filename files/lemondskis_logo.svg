    <polygon points="1144,632 1164,596 1184,632" fill="#0d0d28"/>

    <!-- AMBER GUITAR PICK SHAPE — clipped to strip -->
    <path d="
      M472,652
      Q500,644 528,642 Q564,640 600,640 Q636,640 672,642 Q700,644 728,652
      C784,664 832,696 848,748
      C840,800 820,832 740,852
      C700,860 660,864 600,864
      C540,864 500,860 460,852
      C380,832 360,800 352,748
      C368,696 416,664 472,652
