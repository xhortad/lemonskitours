<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2.25in" height="3.75in" viewBox="0 0 675 1125" role="img" aria-labelledby="title desc">
  <title id="title">Lemonski Tours business card front</title>
  <desc id="desc">Purple business card front featuring the approved Lemonski Tours trail badge.</desc>

  <rect width="675" height="1125" fill="#26215C"/>

  <g fill="none" stroke="#AFA9EC" stroke-width="1.5" stroke-opacity=".32">
    <rect x="-280" y="-280" width="560" height="560"
